<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Sem maximum-scale: travar o zoom tira de quem enxerga pouco a única saída. O zoom
         que atrapalhava (o do iPhone ao tocar num campo) não volta, porque todo campo tem
         16px — abaixo disso é que o Safari amplia a tela sozinho. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Alicerce — obras e gastos no lugar certo</title>
    <meta name="description" content="Controle de obras para engenheiros e pequenas construtoras: valor fechado, entradas, saldo em aberto e notas lidas automaticamente, com histórico dividido entre os sócios." />
    <meta name="theme-color" content="#0A2A6E" />
    <!-- O app é claro de propósito. Sem isto, o "modo escuro forçado" de alguns navegadores
         Android inverte as cores e o navy vira outra coisa. -->
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Alicerce" />
    <link rel="canonical" href="https://appalicerce.com.br/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- A prévia do link no WhatsApp: é por onde o convite de sócio chega. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alicerce" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://appalicerce.com.br/" />
    <meta property="og:title" content="Alicerce — obras e gastos no lugar certo" />
    <meta property="og:description" content="Valor fechado, entradas, saldo em aberto e notas lidas automaticamente, com histórico dividido entre os sócios." />
    <meta property="og:image" content="https://appalicerce.com.br/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <style>
      /* A abertura mora aqui, e não num componente React: pinta junto com o HTML, antes de
         qualquer JavaScript chegar. Antes, a tela ficava em branco enquanto o app baixava,
         e só então a abertura começava — duas esperas somadas. Agora é uma só, e com a
         marca na tela desde o primeiro quadro.

         A animação é CSS de propósito: roda na thread de composição, então segue lisa
         mesmo com o celular ocupado lendo o JavaScript. Quem tira a abertura é o app
         (src/lib/abertura.ts), assim que a primeira tela de verdade está montada atrás. */
      #abertura {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #0A2A6E;
        padding-top: env(safe-area-inset-top);
        transition: opacity .32s cubic-bezier(.4, 0, .2, 1), transform .32s cubic-bezier(.4, 0, .2, 1);
      }
      #abertura.saindo {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      /* A marca (Marco) e o nome. O pórtico se desenha, a laje sobe, o nome aparece. */
      #abertura svg { display: block; overflow: visible; }
      #abertura .ab-marca { width: 88px; height: 78px; }
      #abertura .ab-nome { width: 117px; height: 26px; }
      #abertura .ab-portico { stroke-dasharray: 84; animation: ab-traca .55s cubic-bezier(.22, .8, .3, 1) both; }
      #abertura .ab-laje { animation: ab-sobe .5s .18s cubic-bezier(.22, .8, .3, 1) both; }
      #abertura .ab-nome { animation: ab-sobe .5s .3s cubic-bezier(.22, .8, .3, 1) both; }
      @keyframes ab-traca { from { stroke-dashoffset: 84; } to { stroke-dashoffset: 0; } }
      @keyframes ab-sobe { from { opacity: 0; transform: translateY(8px); } }
      /* Só aparece se o app demorar: em canteiro de obra, sinal fraco é o normal, e uma
         abertura parada sem explicação parece app travado. */
      #abertura p {
        position: absolute;
        bottom: calc(40px + env(safe-area-inset-bottom));
        margin: 0;
        padding: 0 24px;
        text-align: center;
        font: 13px/1.4 system-ui, sans-serif;
        color: rgba(255, 255, 255, .72);
        animation: ab-aparece .4s 6s both;
      }
      @keyframes ab-aparece { from { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #abertura .ab-portico, #abertura .ab-laje, #abertura .ab-nome { animation: none; }
        #abertura { transition-duration: .01s; }
      }
    </style>
  </head>

name: APK do Android

# Todo commit na main vira um APK instalável, baixável na aba Actions.
# A máquina daqui não tem JDK nem Android SDK; o runner do GitHub tem os dois.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # O Capacitor 8 exige JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # O projeto compila contra a 36 (android/variables.gradle). A imagem do runner
      # costuma trazer, mas pedir explicitamente evita um build quebrado no dia em que
      # a imagem mudar.
      - name: Garantir o SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependências
        run: npm ci

      # O .env não é versionado. Estes dois valores são públicos por natureza — a
      # publishable key já vai embutida no site publicado, e quem protege os dados é
      # a RLS do Supabase. Para apontar o APK para outro projeto, defina as duas como
      # Variables do repositório em Settings → Secrets and variables → Actions.
      - name: Apontar para o Supabase
        run: |
          URL="${{ vars.VITE_SUPABASE_URL }}"
          KEY="${{ vars.VITE_SUPABASE_ANON_KEY }}"
          echo "VITE_SUPABASE_URL=${URL:-https://ryygkiehthqjaivtafkg.supabase.co}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${KEY:-sb_publishable_XuAbIn2X0ANSqIEbTOt4sA_EvBfSyCK}" >> .env

      - name: Compilar o site
        run: npm run build

      - name: Copiar para o projeto Android
        run: npx cap sync android

      # O gradlew foi versionado no Windows e chega sem o bit de execução.
      - name: Montar o APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: alicerce-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
